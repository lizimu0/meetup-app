name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server-node/package-lock.json
      - run: npm ci
      - run: npx vitest run
